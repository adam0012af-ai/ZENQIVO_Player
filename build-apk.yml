name: Build ZENQIVO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --debug \
            --dart-define=ZENQIVO_API_URL=https://example.com

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk ZENQIVO-Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZENQIVO-Player-APK
          path: ZENQIVO-Player.apk
          retention-days: 14
